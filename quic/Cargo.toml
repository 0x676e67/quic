[package]
name = "quic"
version = "0.11.0"
authors.workspace = true
license = "Apache-2.0 AND MIT"
repository.workspace = true
description = "Versatile QUIC transport protocol implementation"
readme = "../README.md"
keywords.workspace = true
categories.workspace = true
workspace = ".."
edition.workspace = true
rust-version.workspace = true


[features]
# NOTE: Please keep this in sync with the feature list in `.github/workflows/codecov.yml`, see
# comment in that file for more information.
default = ["tracing-log", "platform-verifier", "runtime-tokio", "rustls-ring", "bloom"]

# Enables `Endpoint::client` and `Endpoint::server` conveniences
aws-lc-rs = ["proto/aws-lc-rs"]
aws-lc-rs-fips = ["proto/aws-lc-rs-fips"]

# Enables BloomTokenLog, and uses it by default
bloom = ["proto/bloom"]

# Records how long locks are held, and warns if they are held >= 1ms
lock_tracking = []

# Provides `ClientConfig::with_platform_verifier()` convenience method
platform-verifier = ["proto/platform-verifier", "dep:rustls-platform-verifier"]

# For backwards compatibility, `rustls` forwards to `rustls-ring`
rustls = ["rustls-ring"]

# Enable rustls with the `aws-lc-rs` crypto provider
rustls-aws-lc-rs = ["dep:rustls", "aws-lc-rs", "proto/rustls-aws-lc-rs", "proto/aws-lc-rs"]
rustls-aws-lc-rs-fips = ["dep:rustls", "aws-lc-rs-fips", "proto/rustls-aws-lc-rs-fips", "proto/aws-lc-rs-fips"]

# Enable rustls with the `ring` crypto provider
rustls-ring = ["dep:rustls", "ring", "proto/rustls-ring", "proto/ring"]

# Enable the `ring` crypto provider.
# Outside wasm*-unknown-unknown targets, this enables `Endpoint::client` and `Endpoint::server` conveniences.
ring = ["proto/ring"]
runtime-tokio = ["tokio/time", "tokio/rt", "tokio/net"]
runtime-smol = ["dep:async-io", "dep:smol"]
# Enables the completion-I/O frontend under `quic::compio`.
runtime-compio = [
    "dep:compio-buf",
    "dep:compio-driver",
    "dep:compio-io",
    "dep:compio-log",
    "dep:compio-net",
    "dep:compio-runtime",
    "dep:flume",
    "dep:futures-util",
    "dep:synchrony",
    "compio-driver/io-uring",
]
# Uses Compio's polling driver on Linux in addition to the default io_uring driver.
runtime-compio-polling = ["runtime-compio", "compio-driver/polling"]
# Uses thread-safe handles inside the Compio frontend. Compio tasks remain runtime-local.
runtime-compio-sync = [
    "runtime-compio",
    "compio-driver/sync",
    "compio-io/sync",
    "compio-net/sync",
]
# Enables HTTP/3 trait implementations for the Compio frontend.
compio-h3 = ["runtime-compio", "dep:h3", "dep:h3-datagram"]
native-certs = ["runtime-compio", "dep:rustls-native-certs"]
webpki-roots = ["runtime-compio", "dep:webpki-roots"]
windows-gro = ["runtime-compio"]

# Configure `tracing` to log events via `log` if no `tracing` subscriber exists.
tracing-log = ["tracing/log", "proto/tracing-log", "udp/tracing-log"]
# Enable rustls logging
rustls-log = ["rustls?/logging"]
# Enable qlog support
qlog = ["proto/qlog"]

# Internal (PRIVATE!) features used to aid testing.
# Don't rely on these whatsoever. They may disappear at any time.

__rustls-post-quantum-test =  ["rustls/prefer-post-quantum", "rustls-aws-lc-rs", "proto/__rustls-post-quantum-test"]

[dependencies]
async-io = { workspace = true, optional = true }
bytes = { workspace = true }
compio-buf = { workspace = true, optional = true, features = ["bytes"] }
compio-driver = { workspace = true, optional = true }
compio-io = { workspace = true, optional = true, features = ["ancillary", "bytemuck"] }
compio-log = { workspace = true, optional = true }
compio-net = { workspace = true, optional = true }
compio-runtime = { workspace = true, optional = true, features = ["time"] }
flume = { workspace = true, optional = true, features = ["async"] }
# Enables futures::io::{AsyncRead, AsyncWrite} support for streams
futures-io = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
h3 = { workspace = true, optional = true }
h3-datagram = { workspace = true, optional = true }
rustc-hash = { workspace = true }
pin-project-lite = { workspace = true }
proto = { package = "quic-proto", path = "../quic-proto", version = "0.11.16", default-features = false }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
smol = { workspace = true, optional = true }
synchrony = { workspace = true, optional = true, features = ["async_flag"] }
thiserror = { workspace = true }
tracing =  { workspace = true }
tokio = { workspace = true }
udp = { package = "quinn-udp", version = "0.6.1", default-features = false, features = ["tracing"] }
webpki-roots = { workspace = true, optional = true }

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
socket2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
web-time = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
crc = { workspace = true }
bencher = { workspace = true }
directories-next = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "macros", "test-util"] }
tracing-subscriber = { workspace = true }
url = { workspace = true }
compio-macros = { workspace = true }

[build-dependencies]
cfg_aliases = { workspace = true }

[lints]
workspace = true

[[example]]
name = "server"
required-features = ["rustls-ring"]

[[example]]
name = "client"
required-features = ["rustls-ring"]

[[example]]
name = "insecure_connection"
required-features = ["rustls-ring"]

[[example]]
name = "single_socket"
required-features = ["rustls-ring"]

[[example]]
name = "connection"
required-features = ["rustls-ring"]

[[test]]
name = "post_quantum"
required-features = ["__rustls-post-quantum-test"]

[[test]]
name = "compio"
required-features = ["runtime-compio", "rustls-ring"]

[[bench]]
name = "bench"
harness = false
required-features = ["rustls-ring"]

[package.metadata.docs.rs]
# all non-default features except fips (cannot build on docs.rs environment)
features = ["lock_tracking", "rustls-aws-lc-rs", "rustls-ring", "runtime-tokio", "runtime-smol", "runtime-compio", "runtime-compio-polling", "tracing-log", "rustls-log"]
