[package]
name = "fuzz"
version = "0.1.0"
publish = false
license.workspace = true
edition = "2021"
authors.workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.0.1", features = ["derive"] }
libfuzzer-sys = "0.4.2"

[dependencies.proto]
features = ["arbitrary"]
path = "../quic-proto"
package = "quic-proto"

[[bin]]
name = "streams"
path = "fuzz_targets/streams.rs"
test = false
doc = false

[[bin]]
name = "streamid"
path = "fuzz_targets/streamid.rs"
test = false
doc = false

[[bin]]
name = "packet"
path = "fuzz_targets/packet.rs"
test = false
doc = false

[[bin]]
name = "params"
path = "fuzz_targets/params.rs"
test = false
doc = false
